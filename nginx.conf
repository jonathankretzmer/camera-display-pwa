server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Service worker, manifest and shell must revalidate so updates roll out.
  location ~* ^/(sw\.js|index\.html|manifest\.webmanifest|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
